# Local Jaeger all-in-one for inspecting agent-status traces.
#
# Usage:
#   docker compose -f contrib/jaeger/docker-compose.yml up -d
#   LOG_TRACES=otlp OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
#     agent-status server
#   open http://localhost:16686    # Jaeger UI; service = "agent-status"
#
# The Jaeger 1.66+ all-in-one image accepts OTLP natively on the
# 4317 (gRPC) / 4318 (HTTP) ports, so no separate OTel Collector is
# required. Drop "ports" you don't need; only 16686 (UI) and 4318
# (OTLP/HTTP) are strictly necessary for the default mode.

services:
  jaeger:
    image: jaegertracing/jaeger:2.4.0
    container_name: agent-status-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP/gRPC
      - "4318:4318"     # OTLP/HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
