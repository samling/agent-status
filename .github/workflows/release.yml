name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - target: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          name="agent-status_${version}_${{ matrix.target }}"
          go build -trimpath -ldflags="-s -w -X github.com/samling/agent-status/internal/version.Version=v${version}" -o "dist/${name}/agent-status" ./cmd/agent-status
          mkdir -p "dist/${name}/hooks"
          cp README.md scripts/post-agent-status.sh "dist/${name}/" 2>/dev/null || true
          cp hooks/claude-code.json hooks/codex.json "dist/${name}/hooks/" 2>/dev/null || true
          (cd dist && tar czf "${name}.tar.gz" "${name}")

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
